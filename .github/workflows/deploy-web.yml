name: Deploy Web Frontend (Static Export)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: 📂 Cache pnpm modules
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: 📥 Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build static export
        working-directory: apps/web
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: 🔧 Prepare .htaccess for clean URLs
        run: |
          cat > apps/web/out/.htaccess << 'EOF'
          RewriteEngine On
          
          # Force HTTPS
          RewriteCond %{HTTPS} off
          RewriteRule ^(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
          
          # Remove .html extension for clean URLs
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteCond %{REQUEST_FILENAME}\.html -f
          RewriteRule ^(.*)$ $1.html [L]
          
          # Handle 404 errors
          ErrorDocument 404 /404.html
          
          # Security Headers
          <IfModule mod_headers.c>
              Header set X-Content-Type-Options "nosniff"
              Header set X-Frame-Options "SAMEORIGIN"
              Header set X-XSS-Protection "1; mode=block"
          </IfModule>
          
          # Cache Control
          <IfModule mod_expires.c>
              ExpiresActive On
              ExpiresByType image/webp "access plus 1 year"
              ExpiresByType image/jpg "access plus 1 year"
              ExpiresByType image/jpeg "access plus 1 year"
              ExpiresByType image/gif "access plus 1 year"
              ExpiresByType image/png "access plus 1 year"
              ExpiresByType image/svg+xml "access plus 1 year"
              ExpiresByType text/css "access plus 1 month"
              ExpiresByType application/javascript "access plus 1 month"
          </IfModule>
          
          # Prevent directory listing
          Options -Indexes
          EOF

      - name: 📤 Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./apps/web/out/
          server-dir: /spurvancelabs.com/web/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/node_modules/**
            **/.env*
            **/README.md
            **/.DS_Store

      - name: ✅ Deployment Complete
        run: |
          echo "✅ Web frontend deployed successfully!"
          echo "🌐 Visit: https://spurvancelabs.com"