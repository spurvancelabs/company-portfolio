<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title & Description -->
    <title>Spurvance Labs – Building Pakistan's Digital Future</title>
    <meta
      name="description"
      content="Spurvance Labs is a Pakistan-based open-source technology company building secure, privacy-first digital infrastructure for the future."
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://spurvancelabs.com/" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="apple-mobile-web-app-title" content="Spurvance Labs" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spurvance Labs" />
    <meta property="og:title" content="Spurvance Labs – Building Pakistan's Digital Future" />
    <meta
      property="og:description"
      content="Open-source, privacy-first digital infrastructure built in Pakistan for the world."
    />
    <meta property="og:url" content="https://spurvancelabs.com/" />
    <meta property="og:image" content="https://spurvancelabs.com/og-image.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Spurvance Labs – Building Pakistan's Digital Future" />
    <meta
      name="twitter:description"
      content="Building secure, open-source digital products with privacy and sovereignty at the core."
    />
    <meta name="twitter:image" content="https://spurvancelabs.com/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
