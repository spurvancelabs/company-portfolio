name: Deploy SpurvanceLabs.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup pnpm FIRST
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      # 3️⃣ Setup Node AFTER pnpm (Updated to Node.js 20)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          
      # 4️⃣ Debug - list files (optional, can remove after working)
      - name: List files to debug
        run: |
          ls -la
          find . -name "pnpm-lock.yaml" -type f

      # 5️⃣ Install deps
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 6️⃣ Build Next.js
      - name: Build Next.js app
        run: pnpm build

      # 7️⃣ Export static
      - name: Export static files
        run: pnpm next export

      # 8️⃣ Deploy
      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: out/
          server-dir: ${{ secrets.FTP_TARGET }}
          protocol: ftps
          dangerous-clean-slate: true
