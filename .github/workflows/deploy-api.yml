name: Deploy API Backend (PHP)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Validate PHP syntax
        run: |
          find apps/api -name "*.php" -exec php -l {} \; > /dev/null
          echo "✅ PHP syntax validated"

      - name: 📁 Prepare API files
        run: |
          # Create clean deployment directory
          mkdir -p deploy_api
          cp -r apps/api/* deploy_api/
          
          # Remove unnecessary files
          find deploy_api -name ".gitkeep" -delete
          find deploy_api -name "*.md" -delete

      - name: 🔒 Create production .htaccess for API
        run: |
          cat > deploy_api/.htaccess << 'EOF'
          RewriteEngine On
          
          # Force HTTPS
          RewriteCond %{HTTPS} off
          RewriteRule ^(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
          
          # Route all requests through public/index.php
          RewriteCond %{REQUEST_URI} !^/public/
          RewriteRule ^(.*)$ public/index.php [QSA,L]
          
          # Block access to sensitive files
          <FilesMatch "^\.">
              Order allow,deny
              Deny from all
          </FilesMatch>
          
          <FilesMatch "(config|db|\.env|composer|\.json|\.lock)$">
              Order allow,deny
              Deny from all
          </FilesMatch>
          
          # Security headers
          <IfModule mod_headers.c>
              Header set X-Content-Type-Options "nosniff"
              Header set X-Frame-Options "DENY"
              Header set Access-Control-Allow-Origin "https://spurvancelabs.com"
          </IfModule>
          EOF

      - name: 📤 Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./deploy_api/
          server-dir: /spurvancelabs.com/api/              # ← CORRECTED PATH
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.env*
            **/README.md
            **/composer.json
            **/composer.lock

      - name: ✅ Deployment Complete
        run: |
          echo "✅ API backend deployed successfully!"
          echo "🔗 API Endpoint: https://api.spurvancelabs.com"