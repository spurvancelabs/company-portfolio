name: Deploy Web Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --no-frozen-lockfile

      - name: Build
        working-directory: apps/web
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Create .htaccess
        run: |
      - name: Create .htaccess
        run: |
          echo "Build output structure:"
          ls -la apps/web/out/
          
          # Check if pages are files or folders
          if [ -f "apps/web/out/about.html" ]; then
            echo "Pages are HTML files"
            cat > apps/web/out/.htaccess << 'EOF'
            RewriteEngine On
            RewriteCond %{HTTPS} off
            RewriteRule ^(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteCond %{REQUEST_URI} (.+)/$
            RewriteRule ^ %1 [R=301,L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteCond %{REQUEST_FILENAME}.html -f
            RewriteRule ^(.+?)/?$ $1.html [L]
            DirectoryIndex index.html
            Options -Indexes
            ErrorDocument 404 /404.html
            EOF
          else
            echo "Pages are folders with index.html"
            cat > apps/web/out/.htaccess << 'EOF'
            RewriteEngine On
            RewriteCond %{HTTPS} off
            RewriteRule ^(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^(.+)/?$ $1/index.html [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteCond %{DOCUMENT_ROOT}/$1.html -f
            RewriteRule ^(.+?)/?$ $1.html [L]
            Options -Indexes
            ErrorDocument 404 /404.html
            EOF
          fi
          
          echo " .htaccess created based on build structure"

      - name: Deploy to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./apps/web/out/
          server-dir: /web/
          dangerous-clean-slate: true

      - name: Done
        run: echo " Deployed!"