name: Weekly Backup

on:
  schedule:
    - cron: '0 0 * * 0' 
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Create backup via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            cd /home/c3llz0ne/spurvancelabs.com
            mkdir -p backups
            timestamp=$(date +%Y%m%d_%H%M%S)
            
            # Backup web
            if [ -d "web" ]; then
              tar -czf backups/web_${timestamp}.tar.gz web/
              echo " Web backed up"
            fi
            
            # Backup API
            if [ -d "api" ]; then
              tar -czf backups/api_${timestamp}.tar.gz api/
              echo " API backed up"
            fi
            
            # Keep only last 30 days of backups
            find backups -name "*.tar.gz" -mtime +30 -delete
            echo " Old backups cleaned"
            
            # List current backups
            ls -lh backups/