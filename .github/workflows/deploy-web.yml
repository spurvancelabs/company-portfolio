name: Deploy Web Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --no-frozen-lockfile

      - name: Build static export
        working-directory: apps/web
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Create .htaccess
        run: |
          cat > apps/web/out/.htaccess << 'HTACCESS_EOF'
          RewriteEngine On

          # Force HTTPS
          RewriteCond %{HTTPS} off
          RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

          # Remove index.html from URL if accessed directly
          RewriteCond %{THE_REQUEST} /index\.html [NC]
          RewriteRule ^(.*/)?index\.html$ /$1 [R=301,L]

          # Serve existing files/folders normally
          RewriteCond %{REQUEST_FILENAME} -f [OR]
          RewriteCond %{REQUEST_FILENAME} -d
          RewriteRule ^ - [L]

          # Fallback to index.html (required for Next export routing)
          RewriteRule ^ index.html [L]

          DirectoryIndex index.html

          Options -Indexes

          ErrorDocument 404 /404.html

          <IfModule mod_headers.c>
              Header set X-Content-Type-Options "nosniff"
              Header set X-Frame-Options "SAMEORIGIN"
              Header set X-XSS-Protection "1; mode=block"
          </IfModule>

          <IfModule mod_expires.c>
              ExpiresActive On
              ExpiresByType image/webp "access plus 1 year"
              ExpiresByType image/jpg "access plus 1 year"
              ExpiresByType image/jpeg "access plus 1 year"
              ExpiresByType image/gif "access plus 1 year"
              ExpiresByType image/png "access plus 1 year"
              ExpiresByType image/svg+xml "access plus 1 year"
              ExpiresByType text/css "access plus 1 month"
              ExpiresByType application/javascript "access plus 1 month"
              ExpiresByType text/html "access plus 1 hour"
          </IfModule>
          HTACCESS_EOF

          echo "✅ .htaccess created"

      - name: Deploy to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./apps/web/out/
          server-dir: /web/
          dangerous-clean-slate: true

      - name: Done
        run: echo "✅ Deployed to https://spurvancelabs.com"