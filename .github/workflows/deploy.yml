name: Deploy SpurvanceLabs.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup pnpm FIRST
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      # 3️⃣ Setup Node AFTER pnpm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'
          
	- name: List files to debug
  	  run: ls -la
    		ls -la .gitignore
    		find . -name "pnpm-lock.yaml" -type f
    
      # 4️⃣ Install deps
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5️⃣ Build Next.js
      - name: Build Next.js app
        run: pnpm build

      # 6️⃣ Export static
      - name: Export static files
        run: pnpm next export

      # 7️⃣ Deploy
      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: out/
          server-dir: ${{ secrets.FTP_TARGET }}
          protocol: ftps
          dangerous-clean-slate: true
