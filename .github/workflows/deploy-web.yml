name: Deploy Web Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@8.15.0

      - name: Verify files
        run: |
          echo "Current directory:"
          pwd
          echo "Files in apps/web:"
          ls -la apps/web/
          echo "Looking for lock file:"
          find . -name "*.yaml" -type f

      - name: Install dependencies
        working-directory: apps/web
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "Lock file found, using it"
            pnpm install --frozen-lockfile
          else
            echo "No lock file, generating new one"
            pnpm install
          fi

      - name: Build static export
        working-directory: apps/web
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Create .htaccess
        run: |
          cat > apps/web/out/.htaccess << 'EOF'
          RewriteEngine On
          RewriteCond %{HTTPS} off
          RewriteRule ^(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteCond %{REQUEST_FILENAME}\.html -f
          RewriteRule ^(.*)$ $1.html [L]
          ErrorDocument 404 /404.html
          Options -Indexes
          EOF

      - name: Deploy to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./apps/web/out/
          server-dir: /spurvancelabs.com/web/
          dangerous-clean-slate: true

      - name: Done
        run: echo "✅ Deployed to https://spurvancelabs.com"